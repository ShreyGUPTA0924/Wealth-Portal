services:
  - type: web
    name: wealth-portal-ai
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false

  - type: web
    name: wealth-portal-server
    env: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: wealth-portal-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: wealth-portal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wealth-portal-redis
          property: connectionString
      - key: AI_SERVICE_URL
        value: http://wealth-portal-ai:8000
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: wealth-portal-web
    env: node
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: redis
    name: wealth-portal-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow internal and external access

databases:
  - name: wealth-portal-db
    plan: free
    databaseName: wealthportal
    user: wealth
    postgresMajorVersion: "16"
